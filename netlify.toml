[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/transactions"
  to = "/.netlify/functions/transactions"
  status = 200

[[redirects]]
  from = "/api/transactions/:id"
  to = "/.netlify/functions/transactions"
  status = 200
